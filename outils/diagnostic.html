/* ==========================================================================
   3. LES TROIS AXES ET LES QUATRE LECTURES
   Le questionnaire est une matrice : 4 axes x 4 lectures = 16 énoncés.
   Chaque énoncé appartient à un axe ET à une lecture, ce qui rend les deux
   dimensions indépendantes. Un axe se lit en colonne (4 énoncés, 4 à 20),

const AXES = [
  { cle:"entreprise", libelle:"Gestion opérationnelle", couleur:"var(--acier)",   classe:"axe-operationnel",

/* Énoncés, dans l'ordre des lectures pour chaque axe. Tous formulés

/* ==========================================================================

   Le slug HubSpot reste celui déjà créé : les libellés changent sans rien casser.

const PALIERS = [

/* Un score se convertit en palier par sa moyenne par énoncé, quel que soit
   le nombre d'énoncés : 12 pour le global, 4 par axe, 3 par lecture, 1 par cellule. */
function rangDeScore(score, nbEnonces){
  const moyenne = score / nbEnonces;
  if(moyenne <= 2.0) return 0;
  if(moyenne <= 3.0) return 1;
  if(moyenne <= 4.0) return 2;
  return 3;
}

/* ==========================================================================
   5. ÉTAT
   ========================================================================== */
let etat = { categorie:null, taille:null, reponses:{}, index:0, resultat:null, envoiEchoue:false };

const scene = document.getElementById("scene");
const barre = document.getElementById("barre");
const barreZone = document.getElementById("barre-zone");
const compteur = document.getElementById("compteur");

function famille(){
  const c = CATEGORIES.find(x => x.valeur === etat.categorie);
  return c ? c.famille : "conception";
}
function libelleAxe(axe){ return axe.cle === "bim" ? LIBELLE_BIM_PAR_FAMILLE[famille()] : axe.libelle; }

/* La grille : 16 cases, parcourues axe par axe, lecture par lecture. */
function grille(){
  const source = {
    entreprise:ENONCES_ENTREPRISE,
    numerique:ENONCES_NUMERIQUE,
    ia:ENONCES_IA,
    bim:ENONCES_BIM[famille()]
  };
  const cases = [];
  AXES.forEach(a => LECTURES.forEach(l => {
    cases.push({ axe:a.cle, lecture:l.cle, cle:a.cle + "|" + l.cle, texte:source[a.cle][l.cle] });
  }));
  return cases;
}

function progression(pct, texte){
  if(pct === null){ barreZone.style.display = "none"; compteur.style.display = "none"; return; }
  barreZone.style.display = "block";
  compteur.style.display = "block";
  barre.style.width = pct + "%";
  compteur.textContent = texte;
}

/* ==========================================================================

    <div class="boutons"><button class="primaire" id="go">Commencer</button></div>
  `;
  document.getElementById("go").onclick = ecranProfil;
}

  scene.innerHTML = `
    <h2>D'abord, votre organisation</h2>
    <p>Deux précisions qui servent à adapter les énoncés suivants à votre réalité.</p>
    <label class="champ" for="cat">Votre principale activité en construction</label>
    <select id="cat">
      <option value="">Sélectionnez</option>
      ${CATEGORIES.map(c => `<option value="${c.valeur}" ${etat.categorie===c.valeur?"selected":""}>${c.libelle}</option>`).join("")}
    </select>
    <label class="champ" for="tai">Taille de votre organisation</label>
    <select id="tai">
      <option value="">Sélectionnez</option>
      ${TAILLES.map(t => `<option value="${t.valeur}" ${etat.taille===t.valeur?"selected":""}>${t.libelle}</option>`).join("")}
    </select>
    <div class="boutons">
      <button class="primaire" id="suivant" disabled>Continuer</button>
      <button class="discret" id="retour">Retour</button>
    </div>
  `;
  const cat = document.getElementById("cat");
  const tai = document.getElementById("tai");
  const suivant = document.getElementById("suivant");
  const verifier = () => { suivant.disabled = !(cat.value && tai.value); };
  cat.onchange = tai.onchange = verifier;
  verifier();

  suivant.onclick = () => {
    if(etat.categorie && etat.categorie !== cat.value) etat.reponses = {};
    etat.categorie = cat.value;
    etat.taille = tai.value;
    etat.index = 0;
    ecranEnonce();
  };
  document.getElementById("retour").onclick = ecranAccueil;
}

function ecranEnonce(){
  const cases = grille();
  const c = cases[etat.index];
  const axe = AXES.find(a => a.cle === c.axe);
  const lecture = LECTURES.find(l => l.cle === c.lecture);
  progression(Math.round((etat.index / cases.length) * 100), `Énoncé ${etat.index + 1} sur ${cases.length}`);

  scene.innerHTML = `
    <span class="axe-etiquette ${axe.classe}">${libelleAxe(axe)} · ${lecture.libelle}</span>
    <div class="enonce">${c.texte}</div>
    <div class="echelle">
      ${ECHELLE.map(e => `
        <button class="cran ${etat.reponses[c.cle]===e.note?"choisi":""}" data-note="${e.note}">
          <b>${e.note}</b><small>${e.ancre}</small>
        </button>`).join("")}
    </div>
    <div class="ancres"><span>Pas du tout d'accord</span><span>Tout à fait d'accord</span></div>
    <div class="boutons">
      <button class="discret" id="retour">${etat.index === 0 ? "Modifier le profil" : "Énoncé précédent"}</button>
    </div>
  `;

  scene.querySelectorAll(".cran").forEach(el => {
    el.onclick = () => {
      etat.reponses[c.cle] = parseInt(el.dataset.note, 10);
      if(etat.index < cases.length - 1){ etat.index++; ecranEnonce(); }
      else { calculer(); finaliser(); }
    };
  });

  document.getElementById("retour").onclick = () => {
    if(etat.index === 0) ecranProfil();
    else { etat.index--; ecranEnonce(); }
  };
}

/* ==========================================================================
   7. CALCUL
   Trois lectures du même jeu de 12 réponses : par axe, par dimension, et global.
   ========================================================================== */
function note(axe, lecture){ return etat.reponses[axe + "|" + lecture] || 0; }

function calculer(){
  const parAxe = {}, rangAxe = {};
  AXES.forEach(a => {
    parAxe[a.cle] = LECTURES.reduce((t,l) => t + note(a.cle, l.cle), 0);   // 4 à 20
    rangAxe[a.cle] = rangDeScore(parAxe[a.cle], LECTURES.length);
  });

  const parLecture = {}, rangLecture = {};
  LECTURES.forEach(l => {
    parLecture[l.cle] = AXES.reduce((t,a) => t + note(a.cle, l.cle), 0);   // 3 à 15
    rangLecture[l.cle] = rangDeScore(parLecture[l.cle], AXES.length);
  });

  const global = AXES.reduce((t,a) => t + parAxe[a.cle], 0);               // 16 à 80
  const palier = PALIERS[rangDeScore(global, AXES.length * LECTURES.length)];
  const angle  = AXES.map(a => a.cle).sort((x,y) => parAxe[x] - parAxe[y])[0];
  const angleLecture = LECTURES.map(l => l.cle).sort((x,y) => parLecture[x] - parLecture[y])[0];

  etat.resultat = { global, parAxe, rangAxe, parLecture, rangLecture, palier, angle, angleLecture };
}

function detailReponses(){
  const cat = CATEGORIES.find(c => c.valeur === etat.categorie);
  const tai = TAILLES.find(t => t.valeur === etat.taille);
  const r = etat.resultat;
  const lignes = [
    `Catégorie : ${cat ? cat.libelle : "n/d"}`,
    `Taille : ${tai ? tai.libelle : "n/d"}`,
    `Échelle : accord de 1 à 5. Grille 4 axes x 4 lectures.`,
    ""
  ];
  if(r){
    lignes.push(`Score global : ${r.global}/${AXES.length * LECTURES.length * 5}`);
    lignes.push("");
    lignes.push("Lecture par dimension");
    LECTURES.forEach(l => lignes.push(`   ${l.libelle} (${r.parLecture[l.cle]}/${AXES.length * 5}) : ${VERDICTS[l.cle][r.rangLecture[l.cle]].libelle}`));
    lignes.push("");
    lignes.push("Lecture par axe");
    AXES.forEach(a => lignes.push(`   ${libelleAxe(a)} (${r.parAxe[a.cle]}/20) : ${VERDICTS.etat_de_fait[r.rangAxe[a.cle]].libelle}`));
    lignes.push("");
  }
  lignes.push("Réponses détaillées");
  grille().forEach((c,i) => {
    lignes.push(`   Q${i+1} [${c.axe} / ${c.lecture}] ${etat.reponses[c.cle]}/5 : ${c.texte}`);
  });
  return lignes.join("\n");
}

/* ==========================================================================
   8. GATE ET ENVOI HUBSPOT
   ========================================================================== */
/* L'utilisateur s'est déjà identifié à la connexion au site : on saute
   l'écran de coordonnées et on envoie le résultat à HubSpot avec les
   informations du compte, sans bloquer l'affichage des résultats. */
function finaliser(){
  progression(100, "Terminé");
  let contact = { prenom:"", nom:"", entreprise:"", courriel:"" };
  try {
    const u = JSON.parse(localStorage.getItem("archiaid_user") || "null");
    if(u){
      const morceaux = (u.nom || "").trim().split(/\s+/).filter(Boolean);
      contact.prenom = morceaux.shift() || "";
      contact.nom = morceaux.join(" ") || contact.prenom;
      contact.courriel = (u.courriel || "").trim();
    }
  } catch(e){}
  if(contact.courriel){
    envoyerHubSpot(contact).catch(e => {
      etat.envoiEchoue = true;
      console.error("Envoi HubSpot échoué :", e);
    });
  }
  ecranResultats();
}

function ecranGate(){
  progression(100, "Terminé");
  scene.innerHTML = `
    <h2>Votre lecture est prête</h2>
    <p>Indiquez où vous joindre et vous verrez votre situation lue sous quatre angles, pour chacun des quatre axes, avec celui à prioriser.</p>
    <label class="champ" for="prenom">Prénom</label>
    <input type="text" id="prenom" autocomplete="given-name">
    <label class="champ" for="nom">Nom</label>
    <input type="text" id="nom" autocomplete="family-name">
    <label class="champ" for="entreprise">Entreprise</label>
    <input type="text" id="entreprise" autocomplete="organization">
    <label class="champ" for="courriel">Courriel professionnel</label>
    <input type="email" id="courriel" autocomplete="email">
    <div class="consentement">
      <input type="checkbox" id="consent">
      <label for="consent">J'accepte que Solutions Archi Aid inc. conserve ces renseignements pour me transmettre mon résultat et communiquer avec moi à ce sujet. Je peux retirer ce consentement en tout temps en écrivant à l'adresse indiquée dans les communications reçues.</label>
    </div>
    <div class="boutons"><button class="primaire" id="voir" disabled>Voir ma lecture complète</button></div>
  `;

  const champs = ["prenom","nom","entreprise","courriel"].map(id => document.getElementById(id));
  const consent = document.getElementById("consent");
  const voir = document.getElementById("voir");

  const valide = () => {
    const courriel = document.getElementById("courriel").value.trim();
    voir.disabled = !(champs.every(c => c.value.trim().length > 0)
                   && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(courriel)
                   && consent.checked);
  };
  champs.forEach(c => c.oninput = valide);
  consent.onchange = valide;

  voir.onclick = async () => {
    voir.disabled = true;
    voir.textContent = "Envoi en cours";
    try {
      await envoyerHubSpot({
        prenom:document.getElementById("prenom").value.trim(),
        nom:document.getElementById("nom").value.trim(),
        entreprise:document.getElementById("entreprise").value.trim(),
        courriel:document.getElementById("courriel").value.trim()
      });
    } catch(e){
      etat.envoiEchoue = true;
      console.error("Envoi HubSpot échoué :", e);
    }
    ecranResultats();
  };
}

async function envoyerHubSpot(contact){
  const r = etat.resultat;
  const base = [
    { name:"email",     value:contact.courriel },
    { name:"firstname", value:contact.prenom },
    { name:"lastname",  value:contact.nom },
    { name:"company",   value:contact.entreprise },
    { name:"maturite_score_global",      value:String(r.global) },
    { name:"maturite_niveau",            value:r.palier.slug },
    { name:"maturite_angle_prioritaire", value:r.angle },
    { name:"maturite_axe_bim",           value:String(r.parAxe.bim) },
    { name:"maturite_axe_ia",            value:String(r.parAxe.ia) },
    { name:"maturite_axe_entreprise",    value:String(r.parAxe.entreprise) },
    { name:"maturite_reponses_json",     value:detailReponses() },
    { name:"maturite_date",              value:new Date().toISOString().split("T")[0] }
  ];
  const profil = [
    { name:"maturite_categorie", value:etat.categorie },
    { name:"maturite_taille",    value:etat.taille }
  ];

  async function soumettre(champs){
    const reponse = await fetch(
      `https://api.hsforms.com/submissions/v3/integration/submit/${CONFIG.PORTAL_ID}/${CONFIG.FORM_GUID}`,
      { method:"POST", headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          fields:champs,
          context:{ pageUri:window.location.href, pageName:document.title },
          legalConsentOptions:{ consent:{ consentToProcess:true,
            text:"J'accepte que Solutions Archi Aid inc. conserve ces renseignements pour me transmettre mon résultat et communiquer avec moi à ce sujet." } }
        })
      }
    );
    if(!reponse.ok) throw new Error("HTTP " + reponse.status + " " + await reponse.text());
  }

  if(!CONFIG.PROPRIETES_PROFIL_ACTIVES) return soumettre(base);

  try {
    await soumettre(base.concat(profil));
  } catch(e){
    // HubSpot rejette la soumission entière si un champ n'existe pas sur le
    // formulaire. On réessaie sans le profil pour ne pas perdre le prospect,
    // en laissant une trace dans la console.
    console.warn("Champs de profil refusés par HubSpot, nouvelle tentative sans eux. Créez maturite_categorie et maturite_taille et ajoutez-les au formulaire.", e);
    await soumettre(base);
  }
}

/* ==========================================================================
   9. RÉSULTATS
   ========================================================================== */
function ecranResultats(){
  const r = etat.resultat;
  const axePrio = AXES.find(a => a.cle === r.angle);
  const lecturePrio = LECTURES.find(l => l.cle === r.angleLecture);

  // Bloc principal : une dimension, un verdict, une explication.
  const dimensions = LECTURES.map(l => {
    const v = VERDICTS[l.cle][r.rangLecture[l.cle]];
    return `
      <div class="lecture-bloc">
        <div class="lecture-entete">
          <span class="lecture-cle">${l.libelle}</span>
          <span class="lecture-val">${v.libelle}</span>
        </div>
        <div class="lecture-note">${l.question} &nbsp;·&nbsp; ${r.parLecture[l.cle]} / ${AXES.length * 5}</div>
        <p class="lecture-texte">${v.texte}</p>
      </div>`;
  }).join("");

  // Matrice complète : chaque cellule vient d'un énoncé précis.
  const matrice = `
    <table class="matrice">
      <thead>
        <tr><th></th>
          ${AXES.map(a => `<th><span class="col-axe">${libelleAxe(a)}</span><span class="col-note">${r.parAxe[a.cle]} / 20</span></th>`).join("")}
        </tr>
      </thead>
      <tbody>
        ${LECTURES.map(l => `
          <tr><th scope="row">${l.libelle}</th>
            ${AXES.map(a => {
              const rang = rangDeScore(note(a.cle, l.cle), 1);
              return `<td${a.cle === r.angle ? ' class="col-prio"' : ""}>${VERDICTS[l.cle][rang].libelle}</td>`;
            }).join("")}
          </tr>`).join("")}
      </tbody>
    </table>`;

  const blocsMobile = AXES.map(a => `
    <div class="bloc-axe${a.cle === r.angle ? " bloc-prio" : ""}">
      <div class="axe-titre"><span>${libelleAxe(a)}</span><span>${r.parAxe[a.cle]} / 20</span></div>
      <div class="axe-jauge"><span style="width:${(r.parAxe[a.cle]/20)*100}%;background:${a.couleur}"></span></div>
      ${LECTURES.map(l => {
        const rang = rangDeScore(note(a.cle, l.cle), 1);
        return `<div class="paire"><span>${l.libelle}</span><span>${VERDICTS[l.cle][rang].libelle}</span></div>`;
      }).join("")}
    </div>`).join("");

  scene.innerHTML = `
    <div class="score-bloc"><div class="score-chiffre">${r.global}<span class="score-sur"> / ${AXES.length * LECTURES.length * 5}</span></div></div>

    <h3>Votre situation, sous quatre angles</h3>
    <p>Chaque angle est calculé sur des énoncés différents. Il est normal qu'ils ne se situent pas au même niveau : c'est précisément l'écart entre eux qui indique par où commencer.</p>
    ${dimensions}

    <h3 style="margin-top:34px">La grille complète</h3>
    <p>Croisement des quatre angles et des quatre axes. La colonne mise en évidence est celle où votre score est le plus faible.</p>
    <div class="vue-large">${matrice}</div>
    <div class="vue-etroite">${blocsMobile}</div>

    <div class="encadre">
      <h3>Par où commencer</h3>
      <p>Votre point d'appui le plus faible se situe sur l'axe <strong>${libelleAxe(axePrio)}</strong>, et transversalement sur la dimension <strong>${lecturePrio.libelle.toLowerCase()}</strong>. ${axePrio.conseil}</p>
    </div>

    <div class="boutons" data-html2canvas-ignore>
      <button class="primaire" id="pdf">Télécharger en PDF</button>
      <button class="primaire" id="rdv">Réserver une rencontre</button>
      <button class="discret" id="refaire">Refaire le diagnostic</button>
    </div>
  `;

  document.getElementById("pdf").onclick = () =>
    telechargerPDF(".carte", "ArchiAid-Diagnostic-Maturite.pdf", document.getElementById("pdf"));
  document.getElementById("rdv").onclick = () => window.open(CONFIG.URL_RENDEZVOUS, "_blank");
  document.getElementById("refaire").onclick = () => {
    etat = { categorie:null, taille:null, reponses:{}, index:0, resultat:null, envoiEchoue:false };
    ecranAccueil();
  };
}

ecranAccueil();

/* ==========================================================================
   10. INTÉGRATION EN IFRAME
   Communique la hauteur réelle du contenu à la page WordPress qui l'héberge,
   pour que l'iframe s'ajuste au lieu d'afficher une barre de défilement interne.
   Sans effet si la page est ouverte directement.
   ========================================================================== */
(function(){
  if(window.parent === window) return;          // pas dans une iframe
  let derniere = 0;
  function annoncer(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
    if(Math.abs(h - derniere) < 2) return;
    derniere = h;
    window.parent.postMessage({ archiaidDiagnostic:true, hauteur:h }, "*");
  }
  window.addEventListener("load", annoncer);
  if(window.ResizeObserver) new ResizeObserver(annoncer).observe(document.body);
  setInterval(annoncer, 500);                   // filet de sécurité
  annoncer();
})();
</script>

<!-- ==========================================================================
     11. TÉLÉCHARGEMENT PDF
     Convertit la carte de résultats en PDF téléchargeable (html2pdf).
     En cas d'échec (hors ligne, blocage du CDN), on retombe sur l'impression
     du navigateur, qui permet aussi d'enregistrer en PDF.
     ========================================================================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
function telechargerPDF(selecteur, nomFichier, bouton){
  const cible = document.querySelector(selecteur);
  if(!cible) return;
  const texteInitial = bouton ? bouton.textContent : "";
  const retablir = () => { if(bouton){ bouton.disabled = false; bouton.textContent = texteInitial; } };
  if(bouton){ bouton.disabled = true; bouton.textContent = "Génération du PDF…"; }
  if(typeof html2pdf === "undefined"){ retablir(); window.print(); return; }
  html2pdf().set({
    margin:[10, 8, 12, 8],
    filename:nomFichier,
    image:{ type:"jpeg", quality:0.95 },
    html2canvas:{ scale:2, useCORS:true, backgroundColor:"#ffffff" },
    jsPDF:{ unit:"mm", format:"a4", orientation:"portrait" },
    pagebreak:{ mode:["avoid-all", "css", "legacy"] }
  }).from(cible).save()
    .then(retablir)
    .catch(function(e){ console.error("PDF échoué :", e); retablir(); window.print(); });
}
</script>
