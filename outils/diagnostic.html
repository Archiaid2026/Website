<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic de maturité numérique | Archi Aid</title>
<style>
  :root{
    --rouille:#6A1400;
    --brun:#241B19;
    --acier:#2D4A6B;
    --terracotta:#AF7E7B;
    --sarcelle:#2E6F6B;
    --fond:#FBF9F7;
    --carte:#FFFFFF;
    --trait:#E4DCD7;
    --texte:#241B19;
    --texte-doux:#6E625E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--fond);color:var(--texte);line-height:1.55;padding:32px 16px 64px}
  .cadre{max-width:780px;margin:0 auto}

  .entete{margin-bottom:28px}
  .marque{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rouille);font-weight:700;margin-bottom:6px}
  .barre{height:4px;background:var(--trait);border-radius:2px;overflow:hidden;margin-top:18px}
  .barre span{display:block;height:100%;width:0;background:var(--rouille);transition:width .3s ease}
  .compteur{font-size:13px;color:var(--texte-doux);margin-top:8px}

  .carte{background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:32px}
  @media(max-width:560px){.carte{padding:22px}}

  h1{font-size:28px;line-height:1.25;font-weight:700;margin-bottom:14px}
  h2{font-size:21px;line-height:1.4;font-weight:600;margin-bottom:8px}
  h3{font-size:16px;font-weight:700;margin-bottom:10px}
  p{margin-bottom:14px;color:var(--texte-doux)}
  p.plein{color:var(--texte)}

  /* Choix de la langue */
  .langues{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .langue{background:var(--rouille);color:#fff;padding:13px 26px;font-size:15px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;border:none}
  .langue:hover{background:#560F00}
  .langue:focus-visible{outline:2px solid var(--acier);outline-offset:2px}

  .axe-etiquette{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:4px;margin-bottom:16px}
  .axe-operational_management{background:#EDF1F6;color:var(--acier)}
  .axe-ai_integration{background:#E9F2F1;color:var(--sarcelle)}
  .axe-bim_maturity{background:#F6EDEB;color:var(--rouille)}

  .enonce{font-size:20px;line-height:1.45;font-weight:600;margin-bottom:26px}
  @media(max-width:560px){.enonce{font-size:18px}}

  .echelle{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
  .cran{border:1.5px solid var(--trait);border-radius:8px;background:#fff;padding:16px 4px 12px;cursor:pointer;text-align:center;transition:border-color .15s ease,background .15s ease;font-family:inherit}
  .cran:hover{border-color:var(--terracotta);background:#FDFBFA}
  .cran:focus-visible{outline:2px solid var(--acier);outline-offset:2px}
  .cran.choisi{border-color:var(--rouille);background:#FCF6F4}
  .cran b{display:block;font-size:22px;font-weight:700;color:var(--rouille);line-height:1}
  .cran small{display:block;font-size:11px;color:var(--texte-doux);margin-top:7px;line-height:1.25;min-height:28px}
  @media(max-width:480px){.cran{padding:13px 2px 10px}.cran b{font-size:19px}.cran small{font-size:10px;min-height:34px}}

  label.champ{display:block;font-size:13px;font-weight:600;margin-bottom:6px;margin-top:16px}
  select,input[type=text],input[type=email]{width:100%;padding:12px 13px;font-size:15px;font-family:inherit;border:1.5px solid var(--trait);border-radius:8px;background:#fff;color:var(--texte)}
  select:focus,input:focus{outline:none;border-color:var(--acier)}

  .boutons{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
  button{font-family:inherit;font-size:15px;border-radius:8px;cursor:pointer;border:none}
  .primaire{background:var(--rouille);color:#fff;padding:13px 26px;font-weight:600}
  .primaire:hover{background:#560F00}
  .primaire:disabled{background:#C9BEB9;cursor:not-allowed}
  .discret{background:none;color:var(--texte-doux);padding:13px 4px;text-decoration:underline}
  .discret:hover{color:var(--texte)}

  /* Résultats : trois scores côte à côte */
  .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 28px}
  .scores.deux{grid-template-columns:repeat(2,1fr)}
  @media(max-width:560px){.scores,.scores.deux{grid-template-columns:1fr}}
  .score-carte{border:1px solid var(--trait);border-radius:8px;padding:18px 16px;text-align:center}
  .score-nom{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte);font-weight:700;min-height:34px}
  .score-chiffre{font-size:44px;font-weight:700;line-height:1.1;margin:6px 0 2px}
  .score-sur{font-size:16px;color:var(--texte-doux);font-weight:400}
  .score-niveau{font-size:14px;font-weight:700;color:var(--brun)}
  .score-carte .axe-jauge{margin-top:12px}

  .axe-jauge{height:8px;background:var(--trait);border-radius:4px;overflow:hidden}
  .axe-jauge span{display:block;height:100%;border-radius:4px}

  /* Détail par axe : ses sous-sections */
  .titre-details{font-size:20px;margin:26px 0 14px}
  .bloc-axe{border:1px solid var(--trait);border-radius:8px;padding:18px 20px;margin-bottom:16px}
  .bloc-entete{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
  .bloc-entete h3{margin:0}
  .bloc-niveau{font-size:15px;font-weight:700;color:var(--rouille);white-space:nowrap}
  .bloc-texte{font-size:14px;color:var(--texte);margin:0 0 14px}
  .sous{display:grid;grid-template-columns:1fr 130px 165px;gap:10px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--trait);font-size:14px}
  .sous.prio{color:var(--rouille);font-weight:700}
  .sous-nom{color:var(--texte)}
  .sous.prio .sous-nom{color:var(--rouille)}
  .sous-val{text-align:right;font-weight:700;color:var(--brun);font-size:13px;white-space:nowrap}
  .sous.prio .sous-val{color:var(--rouille)}
  @media(max-width:560px){.sous{grid-template-columns:1fr auto}.sous .axe-jauge{grid-column:1 / -1}}

  .note-bim{font-size:13px;color:var(--texte-doux);border:1px dashed var(--trait);border-radius:8px;padding:12px 16px;margin-bottom:16px}

  .encadre{background:#F6F2EF;border-left:3px solid var(--rouille);padding:18px 20px;border-radius:0 8px 8px 0;margin:24px 0}
  .encadre h3{color:var(--rouille)}
  .encadre p{margin-bottom:0;color:var(--texte)}
  .encadre-axe{margin:16px 0 0;padding:14px 16px}
  .encadre-axe h3{font-size:14px;margin-bottom:4px}
  .encadre-axe p{font-size:14px}

  .consentement{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:13px;color:var(--texte-doux)}
  .consentement input{margin-top:3px;flex-shrink:0}

  .envoi-note{font-size:14px;color:var(--texte);background:#F6F2EF;border-radius:8px;padding:12px 16px;margin:24px 0 0}
  .envoi-ok{background:#E9F2F1;color:var(--sarcelle)}
  .envoi-echec{background:#F6EDEB;color:var(--rouille)}
</style>
</head>
<body>
<div class="cadre">
  <div class="entete">
    <div class="marque">Archi Aid</div>
    <div style="font-size:15px;color:var(--texte-doux)" id="sous-titre">Diagnostic de maturité numérique</div>
    <div class="barre" id="barre-zone" style="display:none"><span id="barre"></span></div>
    <div class="compteur" id="compteur" style="display:none"></div>
  </div>
  <div class="carte" id="scene"></div>
</div>

<script>

                    en:"I agree that Solutions Archi Aid inc. may keep this information to send me my results and contact me about them. I can withdraw this consent at any time by writing to the address shown in the communications received." },
  detailActivite: { fr:"Activité", en:"Activity" },
  detailTaille:   { fr:"Taille", en:"Size" },

  { valeur:"200_499",     libelle:{ fr:"200 à 499 employés",    en:"200 to 499 employees" } },
  { valeur:"500_ou_plus", libelle:{ fr:"500 employés et plus",  en:"500 employees or more" } }

  { note:1, ancre:{ fr:"Pas du tout d'accord",  en:"Strongly disagree" } },
  { note:2, ancre:{ fr:"Plutôt en désaccord",   en:"Somewhat disagree" } },

        "Your operations are driven by reliable data and processes that survive staff changes."

    },
    sections:[
      { cle:"visibility", paliers:{ fr:["Limitée", "Partielle", "Claire", "Temps réel"], en:["Limited", "Partial", "Clear", "Real-time"] }, libelle:{ fr:"Visibilité et contrôle", en:"Visibility and control" },
        enonces:{
          fr:[ "J'ai une vue d'ensemble de l'exécution de mes projets en cours sans avoir à consulter chaque personne.",
               "L'avancement et les coûts de nos projets sont à jour et consultables en tout temps, pas seulement à la réunion hebdomadaire." ],
          en:[ "I have an overview of how my current projects are progressing without having to ask each person.",
               "Our project progress and costs are up to date and available at any time, not only at the weekly meeting." ]
        },

    ]
  },
  {

/* Quatre paliers par axe et par sous-section (clé `paliers` ci-dessus),
   du plus faible au plus fort, choisis par la moyenne des réponses. */

function rangDeMoyenne(m){
  if(m <= 2.0) return 0;
  if(m <= 3.0) return 1;
  if(m <= 4.0) return 2;
  return 3;
}
function scoreSur100(m){ return Math.round((m - 1) / 4 * 100); }

/* ==========================================================================
   5. ÉTAT
   ========================================================================== */
let etat = { categorie:null, taille:null, reponses:{}, index:0, resultat:null, envoye:null };

const scene = document.getElementById("scene");
const barre = document.getElementById("barre");
const barreZone = document.getElementById("barre-zone");
const compteur = document.getElementById("compteur");

function categorie(){ return CATEGORIES.find(c => c.valeur === etat.categorie) || CATEGORIES[0]; }
function bimEvalue(){ return !!categorie().bim; }
function axesEvalues(){ return AXES.filter(a => !a.bimSeulement || bimEvalue()); }

/* Les énoncés d'une sous-section dans la langue choisie, selon la famille pour le BIM. */
function enoncesDe(section){
  const e = section.enonces;
  if(e.fr) return e[LANG] || e.fr;
  const fam = e[categorie().famille] || e.conception;
  return fam[LANG] || fam.fr;
}

/* La liste ordonnée des énoncés : axe par axe, sous-section par sous-section.
   Le BIM vient en dernier et n'apparaît pas si l'activité ne l'implique pas. */
function liste(){
  const items = [];
  axesEvalues().forEach(a => a.sections.forEach(s => enoncesDe(s).forEach((texte, i) => {
    items.push({ axe:a.cle, section:s.cle, cle:s.cle + "|" + i, texte });
  })));
  return items;
}

function progression(pct, texte){
  if(pct === null){ barreZone.style.display = "none"; compteur.style.display = "none"; return; }
  barreZone.style.display = "block";
  compteur.style.display = "block";
  barre.style.width = pct + "%";
  compteur.textContent = texte;
}

function appliquerLangue(){

function ecranEnonce(){
  const items = liste();
  const c = items[etat.index];
  const axe = AXES.find(a => a.cle === c.axe);
  const section = axe.sections.find(s => s.cle === c.section);
  progression(Math.round((etat.index / items.length) * 100),
              t(UI.enonceSur).replace("{i}", etat.index + 1).replace("{n}", items.length));

  scene.innerHTML = `
    <span class="axe-etiquette axe-${axe.cle}">${t(axe.libelle)} · ${t(section.libelle)}</span>
    <p class="enonce">${c.texte}</p>
    <div class="echelle">
      ${ECHELLE.map(e => `
        <button class="cran ${etat.reponses[c.cle]===e.note?"choisi":""}" data-note="${e.note}">
          <b>${e.note}</b><small>${t(e.ancre)}</small>
        </button>`).join("")}
    </div>
    <div class="boutons" style="margin-top:18px">
      <button class="discret" id="retour">${etat.index === 0 ? t(UI.modifierProfil) : t(UI.enoncePrecedent)}</button>
    </div>
  `;
  scene.querySelectorAll(".cran").forEach(el => {
    el.onclick = () => {
      etat.reponses[c.cle] = Number(el.dataset.note);
      if(etat.index < items.length - 1){ etat.index++; ecranEnonce(); }
      else { calculer(); finaliser(); }
    };
  });
  document.getElementById("retour").onclick = () => {
    if(etat.index === 0) ecranProfil();
    else { etat.index--; ecranEnonce(); }
  };
}

/* ==========================================================================
   7. CALCUL
   Sous-section = moyenne de ses énoncés. Axe = moyenne de ses sous-sections.
   Chaque niveau est converti en palier et en score sur 100. Pas de score global :
   chaque axe reçoit sa propre recommandation, sur sa sous-section la plus faible.
   ========================================================================== */
function calculer(){
  const axes = axesEvalues().map(a => {
    const sections = a.sections.map(s => {
      const notes = enoncesDe(s).map((_, i) => etat.reponses[s.cle + "|" + i] || 0);
      const moyenne = notes.reduce((tot, n) => tot + n, 0) / notes.length;
      return { cle:s.cle, libelle:t(s.libelle), conseil:t(s.conseil), paliers:t(s.paliers), notes, moyenne,
               score:scoreSur100(moyenne), rang:rangDeMoyenne(moyenne), def:s };
    });
    const moyenne = sections.reduce((tot, s) => tot + s.moyenne, 0) / sections.length;
    const prio = sections.slice().sort((x, y) => x.moyenne - y.moyenne)[0];
    return { cle:a.cle, libelle:t(a.libelle), couleur:a.couleur, niveaux:t(a.niveaux), paliers:t(a.paliers), sections, moyenne, prio,
             score:scoreSur100(moyenne), rang:rangDeMoyenne(moyenne) };
  });
  etat.resultat = { axes, bim:bimEvalue() };
}

function detailReponses(){
  const cat = CATEGORIES.find(c => c.valeur === etat.categorie);
  const tai = TAILLES.find(x => x.valeur === etat.taille);
  const r = etat.resultat;
  const lignes = [
    `${t(UI.sousTitre)} · ${new Date().toISOString().split("T")[0]}`,
    `${t(UI.detailActivite)} : ${cat ? t(cat.libelle) : etat.categorie} · ${t(UI.detailTaille)} : ${tai ? t(tai.libelle) : etat.taille}`,
    t(UI.detailEchelle),
    r.bim ? "" : t(UI.detailSansBim),
    ""
  ];
  r.axes.forEach(a => {
    lignes.push(`${a.libelle} : ${a.score}/100 · ${a.paliers[a.rang]}`);
    a.sections.forEach(s => {
      lignes.push(`   ${s.libelle} : ${s.score}/100 · ${s.paliers[s.rang]}`);
      enoncesDe(s.def).forEach((texte, i) => lignes.push(`      ${s.notes[i]}/5 : ${texte}`));
    });
    lignes.push("");
  });
  r.axes.forEach(a => lignes.push(`${t(UI.detailPriorite)} ${a.libelle} : ${a.prio.libelle}`));
  return lignes.join("\n");
}

/* ==========================================================================
   8. CONTACT ET ENVOI HUBSPOT
   ========================================================================== */
function contactConnecte(){
  let contact = { prenom:"", nom:"", entreprise:"", courriel:"" };
  try {
    const u = JSON.parse(localStorage.getItem("archiaid_user") || "null");
    if(u){
      const morceaux = (u.nom || "").trim().split(/\s+/).filter(Boolean);
      contact.prenom = u.prenom || morceaux.shift() || "";
      contact.nom = u.famille || morceaux.join(" ") || contact.prenom;
      contact.entreprise = u.entreprise || "";
      contact.courriel = (u.courriel || "").trim();
    }
  } catch(e){}
  return contact;
}

function finaliser(){
  progression(100, t(UI.termine));
  ecranResultats();
}

async function envoyerResultats(bouton){
  const contact = contactConnecte();
  if(!contact.courriel){ ecranGate(); return; }
  bouton.disabled = true;
  bouton.textContent = t(UI.envoiEnCours);
  try {
    await envoyerHubSpot(contact);
    etat.envoye = CONFIG.PORTAL_ID && CONFIG.FORM_GUID ? "ok" : "inactif";
  } catch(e){
    etat.envoye = "echec";
    console.error("Envoi HubSpot échoué :", e);
  }
  ecranResultats();
}

function messageEnvoi(){
  const contact = contactConnecte();
  if(etat.envoye === "ok")      return `<p class="envoi-note envoi-ok">${t(UI.envoiOk).replace("{e}", contact.courriel)}</p>`;
  if(etat.envoye === "inactif") return `<p class="envoi-note">${t(UI.envoiInactif)}</p>`;
  if(etat.envoye === "echec")   return `<p class="envoi-note envoi-echec">${t(UI.envoiEchec)}</p>`;
  return "";
}

function ecranGate(){
  progression(100, t(UI.termine));
  scene.innerHTML = `
    <h2>${t(UI.gateTitre)}</h2>
    <p>${t(UI.gateTexte)}</p>
    <label class="champ" for="prenom">${t(UI.prenom)}</label>
    <input type="text" id="prenom" autocomplete="given-name">
    <label class="champ" for="nom">${t(UI.nom)}</label>
    <input type="text" id="nom" autocomplete="family-name">
    <label class="champ" for="entreprise">${t(UI.entreprise)}</label>
    <input type="text" id="entreprise" autocomplete="organization">
    <label class="champ" for="courriel">${t(UI.courriel)}</label>
    <input type="email" id="courriel" autocomplete="email">
    <div class="consentement">
      <input type="checkbox" id="consent">
      <label for="consent">${t(UI.consentement)}</label>
    </div>
    <div class="boutons"><button class="primaire" id="voir" disabled>${t(UI.envoyer)}</button></div>
  `;
  const champs = ["prenom","nom","entreprise","courriel"].map(id => document.getElementById(id));
  const consent = document.getElementById("consent");
  const voir = document.getElementById("voir");
  const valide = () => {
    const courriel = document.getElementById("courriel").value.trim();
    voir.disabled = !(champs.every(c => c.value.trim().length > 0)
                   && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(courriel)
                   && consent.checked);
  };
  champs.forEach(c => c.oninput = valide);
  consent.onchange = valide;
  voir.onclick = async () => {
    voir.disabled = true;
    voir.textContent = t(UI.envoiEnCours);
    const contact = {
      prenom:document.getElementById("prenom").value.trim(),
      nom:document.getElementById("nom").value.trim(),
      entreprise:document.getElementById("entreprise").value.trim(),
      courriel:document.getElementById("courriel").value.trim()
    };
    try { localStorage.setItem("archiaid_user", JSON.stringify({ nom:(contact.prenom + " " + contact.nom).trim(), courriel:contact.courriel })); } catch(e){}
    try {
      await envoyerHubSpot(contact);
      etat.envoye = CONFIG.PORTAL_ID && CONFIG.FORM_GUID ? "ok" : "inactif";
    } catch(e){
      etat.envoye = "echec";
      console.error("Envoi HubSpot échoué :", e);
    }
    ecranResultats();
  };
}

/* Les champs envoyés au formulaire HubSpot : un par propriété de contact.
   Les scores BIM ne sont envoyés que si le volet a été évalué. */
function champsHubSpot(contact){
  const r = etat.resultat;
  const champs = [
    { name:"email",            value:contact.courriel },
    { name:"firstname",        value:contact.prenom },
    { name:"lastname",         value:contact.nom },
    { name:"company",          value:contact.entreprise },
    { name:"company_category", value:etat.categorie },
    { name:"company_size",     value:etat.taille }
  ];
  r.axes.forEach(a => {
    champs.push({ name:a.cle + "_score", value:String(a.score) });
    a.sections.forEach(s => champs.push({ name:s.cle + "_score", value:String(s.score) }));
  });
  return champs.filter(c => c.value !== "" && c.value != null);
}

async function envoyerHubSpot(contact){
  if(!CONFIG.PORTAL_ID || !CONFIG.FORM_GUID){
    console.info("HubSpot non configuré : résultat non envoyé.");
    return;
  }
  const tous = champsHubSpot(contact);
  async function soumettre(champs){
    const reponse = await fetch(
      `https://${CONFIG.HSFORMS_HOST}/submissions/v3/integration/submit/${CONFIG.PORTAL_ID}/${CONFIG.FORM_GUID}`,
      { method:"POST", headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          fields:champs,
          context:{ pageUri:window.location.href, pageName:document.title },
          legalConsentOptions:{ consent:{ consentToProcess:true, text:UI.consentement[LANG] } }
        })
      }
    );
    if(!reponse.ok) throw new Error("HTTP " + reponse.status + " " + await reponse.text());
  }
  try {
    await soumettre(tous);
  } catch(e){
    console.warn("Soumission complète refusée, nouvelle tentative avec les champs de base. Vérifiez que toutes les propriétés sont sur le formulaire.", e);
    const base = ["email","firstname","lastname","company"];
    await soumettre(tous.filter(c => base.includes(c.name)));
  }
}

function ecranResultats(){
  const r = etat.resultat;

  const cartes = r.axes.map(a => `
    <div class="score-carte">

      <div class="score-chiffre" style="color:${a.couleur}">${a.score}<span class="score-sur">${t(UI.sur100)}</span></div>
      <div class="score-niveau">${a.paliers[a.rang]}</div>
      <div class="axe-jauge"><span style="width:${a.score}%;background:${a.couleur}"></span></div>
    </div>`).join("");

  const blocs = r.axes.map(a => `
    <div class="bloc-axe">
      <div class="bloc-entete">
        <h3>${a.libelle}</h3>
        <span class="bloc-niveau">${a.score} / 100 · ${a.paliers[a.rang]}</span>
      </div>
      <p class="bloc-texte">${a.niveaux[a.rang]}</p>
      ${a.sections.map(s => `
        <div class="sous ${s.cle === a.prio.cle ? "prio" : ""}">
          <span class="sous-nom">${s.libelle}</span>
          <div class="axe-jauge"><span style="width:${s.score}%;background:${a.couleur}"></span></div>
          <span class="sous-val">${s.score} · ${s.paliers[s.rang]}</span>
        </div>`).join("")}
      <div class="encadre encadre-axe">
        <h3>${t(UI.parOuCommencer)}</h3>
        <p>${t(UI.pointFaible).replace("{s}", a.prio.libelle.toLowerCase())}${a.prio.conseil}</p>
      </div>
    </div>`).join("");

  scene.innerHTML = `
    <h2>${t(UI.scoresTitre)}</h2>
    <div class="scores ${r.axes.length === 2 ? "deux" : ""}">${cartes}</div>
    ${r.bim ? "" : `<div class="note-bim">${t(UI.bimNonEvalue)}</div>`}

    <h3 class="titre-details">${t(UI.details)}</h3>
    ${blocs}

    ${messageEnvoi()}
    <div class="boutons" data-html2canvas-ignore>
      <button class="primaire" id="envoyer" ${etat.envoye === "ok" ? "disabled" : ""}>${etat.envoye === "ok" ? t(UI.envoye) : t(UI.envoyer)}</button>
      <button class="discret" id="refaire">${t(UI.refaire)}</button>
    </div>
  `;

  document.getElementById("envoyer").onclick = (e) => envoyerResultats(e.currentTarget);
  document.getElementById("refaire").onclick = () => {
    etat = { categorie:null, taille:null, reponses:{}, index:0, resultat:null, envoye:null };
    ecranLangue();
  };
}

ecranLangue();

/* ==========================================================================
   10. INTÉGRATION EN IFRAME
   Communique la hauteur réelle du contenu à une page qui l'héberge, pour que
   l'iframe s'ajuste au lieu d'afficher une barre de défilement interne.
   Sans effet si la page est ouverte directement.
   ========================================================================== */
(function(){
  if(window.parent === window) return;
  let derniere = 0;
  function annoncer(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
    if(Math.abs(h - derniere) < 2) return;
    derniere = h;
    window.parent.postMessage({ archiaidDiagnostic:true, hauteur:h }, "*");
  }
  window.addEventListener("load", annoncer);
  if(window.ResizeObserver) new ResizeObserver(annoncer).observe(document.body);
  setInterval(annoncer, 500);
  annoncer();
})();
</script>
