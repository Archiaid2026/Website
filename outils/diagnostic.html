<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic de maturité numérique | Archi Aid</title>
<style>
  :root{
    --rouille:#6A1400;
    --brun:#241B19;
    --acier:#2D4A6B;
    --terracotta:#AF7E7B;
    --sarcelle:#2E6F6B;
    --fond:#FBF9F7;
    --carte:#FFFFFF;
    --trait:#E4DCD7;
    --texte:#241B19;
    --texte-doux:#6E625E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--fond);color:var(--texte);line-height:1.55;padding:32px 16px 64px}
  .cadre{max-width:780px;margin:0 auto}

  .entete{margin-bottom:28px}
  .marque{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rouille);font-weight:700;margin-bottom:6px}
  .barre{height:4px;background:var(--trait);border-radius:2px;overflow:hidden;margin-top:18px}
  .barre span{display:block;height:100%;width:0;background:var(--rouille);transition:width .3s ease}
  .compteur{font-size:13px;color:var(--texte-doux);margin-top:8px}

  .carte{background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:32px}
  @media(max-width:560px){.carte{padding:22px}}

  h1{font-size:28px;line-height:1.25;font-weight:700;margin-bottom:14px}
  h2{font-size:21px;line-height:1.4;font-weight:600;margin-bottom:8px}
  h3{font-size:16px;font-weight:700;margin-bottom:10px}
  p{margin-bottom:14px;color:var(--texte-doux)}
  p.plein{color:var(--texte)}

  .axe-etiquette{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:4px;margin-bottom:16px}
  .axe-operational_management{background:#EDF1F6;color:var(--acier)}
  .axe-ai_integration{background:#E9F2F1;color:var(--sarcelle)}
  .axe-bim_maturity{background:#F6EDEB;color:var(--rouille)}

  .enonce{font-size:20px;line-height:1.45;font-weight:600;margin-bottom:26px}
  @media(max-width:560px){.enonce{font-size:18px}}

  .echelle{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
  .cran{border:1.5px solid var(--trait);border-radius:8px;background:#fff;padding:16px 4px 12px;cursor:pointer;text-align:center;transition:border-color .15s ease,background .15s ease;font-family:inherit}
  .cran:hover{border-color:var(--terracotta);background:#FDFBFA}
  .cran:focus-visible{outline:2px solid var(--acier);outline-offset:2px}
  .cran.choisi{border-color:var(--rouille);background:#FCF6F4}
  .cran b{display:block;font-size:22px;font-weight:700;color:var(--rouille);line-height:1}
  .cran small{display:block;font-size:11px;color:var(--texte-doux);margin-top:7px;line-height:1.25;min-height:28px}
  @media(max-width:480px){.cran{padding:13px 2px 10px}.cran b{font-size:19px}.cran small{font-size:10px;min-height:34px}}
  .ancres{display:flex;justify-content:space-between;font-size:12px;color:var(--texte-doux)}

  label.champ{display:block;font-size:13px;font-weight:600;margin-bottom:6px;margin-top:16px}
  select,input[type=text],input[type=email]{width:100%;padding:12px 13px;font-size:15px;font-family:inherit;border:1.5px solid var(--trait);border-radius:8px;background:#fff;color:var(--texte)}
  select:focus,input:focus{outline:none;border-color:var(--acier)}

  .boutons{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
  button{font-family:inherit;font-size:15px;border-radius:8px;cursor:pointer;border:none}
  .primaire{background:var(--rouille);color:#fff;padding:13px 26px;font-weight:600}
  .primaire:hover{background:#560F00}
  .primaire:disabled{background:#C9BEB9;cursor:not-allowed}
  .discret{background:none;color:var(--texte-doux);padding:13px 4px;text-decoration:underline}
  .discret:hover{color:var(--texte)}

  /* Résultats : trois scores côte à côte */
  .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 28px}
  .scores.deux{grid-template-columns:repeat(2,1fr)}
  @media(max-width:560px){.scores,.scores.deux{grid-template-columns:1fr}}
  .score-carte{border:1px solid var(--trait);border-radius:8px;padding:18px 16px;text-align:center}
  .score-carte.prio{border-color:var(--rouille);background:#FDFAF9}
  .score-nom{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--texte-doux);font-weight:600;min-height:32px}
  .score-chiffre{font-size:44px;font-weight:700;line-height:1.1;margin:6px 0 2px}
  .score-sur{font-size:16px;color:var(--texte-doux);font-weight:400}
  .score-niveau{font-size:14px;font-weight:700;color:var(--brun)}
  .score-carte .axe-jauge{margin-top:12px}

  .axe-jauge{height:8px;background:var(--trait);border-radius:4px;overflow:hidden}
  .axe-jauge span{display:block;height:100%;border-radius:4px}

  /* Détail par axe : ses sous-sections */
  .bloc-axe{border:1px solid var(--trait);border-radius:8px;padding:18px 20px;margin-bottom:16px}
  .bloc-axe.bloc-prio{border-color:var(--rouille);background:#FDFAF9}
  .bloc-entete{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
  .bloc-entete h3{margin:0}
  .bloc-niveau{font-size:15px;font-weight:700;color:var(--rouille);white-space:nowrap}
  .bloc-texte{font-size:14px;color:var(--texte);margin:0 0 14px}
  .sous{display:grid;grid-template-columns:1fr 120px 110px;gap:10px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--trait);font-size:14px}
  .sous.prio{color:var(--rouille);font-weight:700}
  .sous-nom{color:var(--texte)}
  .sous.prio .sous-nom{color:var(--rouille)}
  .sous-val{text-align:right;font-weight:700;color:var(--brun);font-size:13px}
  .sous.prio .sous-val{color:var(--rouille)}
  @media(max-width:520px){.sous{grid-template-columns:1fr 90px}.sous .axe-jauge{grid-column:1 / -1}}

  .note-bim{font-size:13px;color:var(--texte-doux);border:1px dashed var(--trait);border-radius:8px;padding:12px 16px;margin-bottom:16px}

  .encadre{background:#F6F2EF;border-left:3px solid var(--rouille);padding:18px 20px;border-radius:0 8px 8px 0;margin:24px 0}
  .encadre h3{color:var(--rouille)}
  .encadre p{margin-bottom:0;color:var(--texte)}

  .consentement{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:13px;color:var(--texte-doux)}
  .consentement input{margin-top:3px;flex-shrink:0}
</style>
</head>
<body>
<div class="cadre">
  <div class="entete">
    <div class="marque">Archi Aid</div>
    <div style="font-size:15px;color:var(--texte-doux)">Diagnostic de maturité numérique</div>
    <div class="barre" id="barre-zone" style="display:none"><span id="barre"></span></div>
    <div class="compteur" id="compteur" style="display:none"></div>
  </div>
  <div class="carte" id="scene"></div>
</div>

<script>
/* ==========================================================================
   1. CONFIGURATION
   Laisser PORTAL_ID ou FORM_GUID vide désactive l'envoi à HubSpot (le
   résultat s'affiche quand même). À remplir avec le nouveau portail.
   ========================================================================== */
const CONFIG = {
  PORTAL_ID : "",                                          // numéro du portail HubSpot (Hub ID)
  FORM_GUID : "",                                          // formulaire « Digital Maturity Assessment »
  HSFORMS_HOST : "api.hsforms.com",                        // api-eu1.hsforms.com pour un portail hébergé en Europe
  URL_RENDEZVOUS : "https://meetings.hubspot.com/a-remplacer"
};

/* ==========================================================================
   2. PROFIL DE L'ORGANISATION (non noté)
   `bim` indique si le volet BIM est évalué ; `famille` choisit la version
   des énoncés BIM. Les valeurs sont celles des listes HubSpot.
   ========================================================================== */
const CATEGORIES = [
  { valeur:"promoteur",            libelle:"Développement immobilier / Promoteur",                famille:"donneur_ouvrage", bim:true },
  { valeur:"architecture",         libelle:"Architecture",                                         famille:"conception",      bim:true },
  { valeur:"ingenierie",           libelle:"Ingénierie (structure, civil, mécanique, électrique)", famille:"conception",      bim:true },
  { valeur:"entrepreneur_general", libelle:"Entrepreneur général / Gestion de construction",       famille:"realisation",     bim:true },
  { valeur:"autre",                libelle:"Autre",                                                famille:null,              bim:false }
];

const TAILLES = [
  { valeur:"1_9",         libelle:"1 à 9 employés" },
  { valeur:"10_49",       libelle:"10 à 49 employés" },
  { valeur:"50_199",      libelle:"50 à 199 employés" },
  { valeur:"200_499",     libelle:"200 à 499 employés" },
  { valeur:"500_ou_plus", libelle:"500 employés et plus" }
];

const ECHELLE = [
  { note:1, ancre:"Pas du tout d'accord" },
  { note:2, ancre:"Plutôt en désaccord" },
  { note:3, ancre:"Partiellement vrai" },
  { note:4, ancre:"Plutôt d'accord" },
  { note:5, ancre:"Tout à fait d'accord" }
];

/* ==========================================================================
   3. LA HIÉRARCHIE : 3 AXES > 8 SOUS-SECTIONS > 2 ÉNONCÉS
   Les clés d'axe et de sous-section sont les noms internes des propriétés
   HubSpot (suffixe _score ajouté à l'envoi).
   Tous les énoncés sont formulés positivement : accord élevé = maturité élevée.
   ========================================================================== */
const AXES = [
  {
    cle:"operational_management", libelle:"Gestion opérationnelle", couleur:"var(--acier)",
    niveaux:[
      "Le fonctionnement repose sur des personnes plutôt que sur des systèmes. L'information existe, mais il faut savoir à qui la demander.",
      "Des outils et des pratiques sont en place, mais leur usage varie d'une équipe à l'autre. Vous payez pour des capacités que vous n'exploitez qu'en partie.",
      "Vos processus sont documentés et vos systèmes reliés pour l'essentiel. La prochaine étape est de mesurer, pour savoir quoi améliorer.",
      "Vos opérations sont pilotées par des données fiables et des processus qui survivent aux changements de personnel."
    ],
    sections:[
      { cle:"visibility", libelle:"Visibilité et contrôle",
        enonces:[
          "J'ai une vue d'ensemble de l'exécution de mes projets en cours sans avoir à consulter chaque personne.",
          "L'avancement et les coûts de nos projets sont à jour et consultables en tout temps, pas seulement à la réunion hebdomadaire."
        ],
        conseil:"Mettre en place un tableau de bord de projets alimenté par vos outils existants, revu à fréquence fixe." },
      { cle:"process_maturity", libelle:"Maturité des processus",
        enonces:[
          "Nos façons de faire sont documentées et appliquées de la même manière d'un projet à l'autre.",
          "Nos processus sont mesurés et révisés selon un cycle défini, pas seulement lorsqu'un problème survient."
        ],
        conseil:"Documenter les trois processus les plus fréquents et associer à chacun un indicateur suivi chaque mois." },
      { cle:"system_centralization", libelle:"Centralisation des systèmes",
        enonces:[
          "Nos équipes travaillent dans des plateformes communes à l'entreprise plutôt que dans des outils choisis individuellement.",
          "Chaque information a un système de référence unique : il n'existe pas plusieurs versions du même échéancier, du même budget ou du même plan."
        ],
        conseil:"Désigner un système de référence par type d'information et y migrer ce qui vit encore dans les fichiers locaux et les courriels." }
    ]
  },
  {
    cle:"ai_integration", libelle:"Intégration de l'IA", couleur:"var(--sarcelle)",
    niveaux:[
      "L'IA est absente ou à l'essai chez quelques personnes, sans cadre. Le risque tient surtout aux données qui circulent sans règles.",
      "Des usages existent, mais sans gouvernance ni mesure. Les gains restent individuels et difficiles à généraliser.",
      "L'IA est encadrée et utilisée dans plusieurs équipes. Il reste à structurer les données pour en tirer davantage.",
      "L'IA est intégrée à vos façons de faire, avec des gains mesurés et des données prêtes à être exploitées."
    ],
    sections:[
      { cle:"ai_adoption", libelle:"Adoption",
        enonces:[
          "Mes équipes utilisent des outils d'intelligence artificielle dans leur travail courant, pas seulement à l'essai.",
          "L'usage de l'IA est répandu dans plusieurs équipes, pas porté par une ou deux personnes."
        ],
        conseil:"Identifier deux tâches répétitives par équipe et y introduire un outil d'IA avec un accompagnement court." },
      { cle:"ai_governance", libelle:"Gouvernance",
        enonces:[
          "Nous avons des règles écrites sur les informations qui peuvent être soumises à un outil d'IA externe.",
          "Une personne est responsable des choix d'outils d'IA et de leurs usages dans l'entreprise."
        ],
        conseil:"Rédiger une politique d'usage d'une page : données permises, outils approuvés, personne responsable." },
      { cle:"data_readiness", libelle:"Préparation des données",
        enonces:[
          "Nos données de projet sont assez structurées et centralisées pour être exploitées par un outil d'IA.",
          "L'historique de nos projets est accessible et consultable, pas enfoui dans des courriels et des dossiers personnels."
        ],
        conseil:"Structurer d'abord les données de projet les plus demandées : coûts, échéanciers, décisions." }
    ]
  },
  {
    cle:"bim_maturity", libelle:"Maturité BIM", couleur:"var(--rouille)", bimSeulement:true,
    niveaux:[
      "Le BIM est subi plutôt que maîtrisé : la maquette existe parfois, mais le travail réel se fait encore en 2D ou sur papier.",
      "La maquette est utilisée, mais les processus dépendent des personnes et les échanges demandent des reprises.",
      "Vos processus BIM sont formalisés et vos échanges fiables. Le BIM commence à peser dans vos soumissions.",
      "Le BIM est un avantage concurrentiel : processus maîtrisés, données réutilisées, exigences dépassées."
    ],
    sections:[
      { cle:"bim_process", libelle:"Processus BIM",
        enonces:{
          conception:[
            "Chaque mandat démarre avec un plan d'exécution BIM qui définit les livrables et les niveaux de détail par phase.",
            "Nos gabarits, nos bibliothèques et nos normes de modélisation sont communs à tous les projets."
          ],
          realisation:[
            "La coordination avec nos sous-traitants suit un cycle formalisé : les conflits sont détectés avant l'installation.",
            "Nos exigences BIM envers les sous-traitants sont écrites dans les contrats et vérifiées."
          ],
          donneur_ouvrage:[
            "Nos appels d'offres précisent les livrables BIM attendus, et nous vérifions les maquettes reçues avant de les accepter.",
            "Un responsable BIM est désigné de notre côté sur chaque projet, avec un mandat clair."
          ]
        },
        conseil:"Rédiger un plan d'exécution BIM type et l'imposer dès le démarrage de chaque projet." },
      { cle:"data_exchange", libelle:"Échange des données",
        enonces:{
          conception:[
            "Les modèles échangés entre disciplines sont exploitables tels quels, sans reconstruction ni reprise.",
            "Nos quantitatifs et nos tableaux sont extraits de la maquette et réutilisés sans ressaisie."
          ],
          realisation:[
            "Nous extrayons des quantitatifs de la maquette et ils alimentent directement nos estimations.",
            "Les maquettes reçues des concepteurs sont exploitables sans reconstruction par notre équipe."
          ],
          donneur_ouvrage:[
            "Les données du projet sont transférées vers nos systèmes d'exploitation à la réception du bâtiment.",
            "Les maquettes de nos différents projets suivent un format commun qui permet de les comparer."
          ]
        },
        conseil:"Fixer un format d'échange et un niveau de détail par livrable, et vérifier chaque maquette reçue selon ces critères." }
    ]
  }
];

/* Les quatre paliers, pour les axes comme pour les sous-sections.
   `slug` est la valeur interne des listes *_level dans HubSpot. */
const NIVEAUX = [
  { slug:"first_milestones",  libelle:"Premiers jalons" },
  { slug:"momentum_building", libelle:"Élan amorcé" },
  { slug:"well_advanced",     libelle:"Bien avancé" },
  { slug:"leader",            libelle:"Chef de file" }
];

/* Une moyenne par énoncé (1 à 5) se convertit en palier et en score sur 100. */
function rangDeMoyenne(m){
  if(m <= 2.0) return 0;
  if(m <= 3.0) return 1;
  if(m <= 4.0) return 2;
  return 3;
}
function scoreSur100(m){ return Math.round((m - 1) / 4 * 100); }

/* ==========================================================================
   4. ÉTAT
   ========================================================================== */
let etat = { categorie:null, taille:null, reponses:{}, index:0, resultat:null, envoiEchoue:false };

const scene = document.getElementById("scene");
const barre = document.getElementById("barre");
const barreZone = document.getElementById("barre-zone");
const compteur = document.getElementById("compteur");

function categorie(){ return CATEGORIES.find(c => c.valeur === etat.categorie) || CATEGORIES[0]; }
function bimEvalue(){ return !!categorie().bim; }
function axesEvalues(){ return AXES.filter(a => !a.bimSeulement || bimEvalue()); }

/* Les énoncés d'une sous-section, selon la famille pour le BIM. */
function enoncesDe(section){
  if(Array.isArray(section.enonces)) return section.enonces;
  return section.enonces[categorie().famille] || section.enonces.conception;
}

/* La liste ordonnée des énoncés : axe par axe, sous-section par sous-section.
   Le BIM vient en dernier et n'apparaît pas si l'activité ne l'implique pas. */
function liste(){
  const items = [];
  axesEvalues().forEach(a => a.sections.forEach(s => enoncesDe(s).forEach((texte, i) => {
    items.push({ axe:a.cle, section:s.cle, cle:s.cle + "|" + i, texte });
  })));
  return items;
}

function progression(pct, texte){
  if(pct === null){ barreZone.style.display = "none"; compteur.style.display = "none"; return; }
  barreZone.style.display = "block";
  compteur.style.display = "block";
  barre.style.width = pct + "%";
  compteur.textContent = texte;
}

/* ==========================================================================
   5. ÉCRANS
   ========================================================================== */
function ecranAccueil(){
  progression(null);
  scene.innerHTML = `
    <h1>Où en est votre organisation dans sa transformation numérique ?</h1>
    <p class="plein">Seize énoncés, environ quatre minutes. Pour chaque énoncé, vous indiquez à quel point il décrit votre réalité, de 1 à 5.</p>
    <p>Votre situation est ensuite lue sur trois axes : gestion opérationnelle, intégration de l'IA et maturité BIM. Chaque axe se décompose en sous-sections qui indiquent précisément par où commencer. Le volet BIM s'adapte au type d'activité que vous exercez.</p>
    <div class="boutons"><button class="primaire" id="go">Commencer</button></div>
  `;
  document.getElementById("go").onclick = ecranProfil;
}

function ecranProfil(){
  progression(0, "Profil de votre organisation");
  scene.innerHTML = `
    <h2>D'abord, votre organisation</h2>
    <p>Deux précisions qui servent à adapter les énoncés suivants à votre réalité.</p>
    <label class="champ" for="cat">Votre principale activité en construction</label>
    <select id="cat">
      <option value="">Sélectionnez</option>
      ${CATEGORIES.map(c => `<option value="${c.valeur}" ${etat.categorie===c.valeur?"selected":""}>${c.libelle}</option>`).join("")}
    </select>
    <label class="champ" for="tai">Taille de votre organisation</label>
    <select id="tai">
      <option value="">Sélectionnez</option>
      ${TAILLES.map(t => `<option value="${t.valeur}" ${etat.taille===t.valeur?"selected":""}>${t.libelle}</option>`).join("")}
    </select>
    <div class="boutons">
      <button class="primaire" id="suivant" disabled>Continuer</button>
      <button class="discret" id="retour">Retour</button>
    </div>
  `;
  const cat = document.getElementById("cat");
  const tai = document.getElementById("tai");
  const suivant = document.getElementById("suivant");
  const verifier = () => { suivant.disabled = !(cat.value && tai.value); };
  cat.onchange = tai.onchange = verifier;
  verifier();

  suivant.onclick = () => {
    if(etat.categorie && etat.categorie !== cat.value) etat.reponses = {};
    etat.categorie = cat.value;
    etat.taille = tai.value;
    etat.index = 0;
    ecranEnonce();
  };
  document.getElementById("retour").onclick = ecranAccueil;
}

function ecranEnonce(){
  const items = liste();
  const c = items[etat.index];
  const axe = AXES.find(a => a.cle === c.axe);
  const section = axe.sections.find(s => s.cle === c.section);
  progression(Math.round((etat.index / items.length) * 100), `Énoncé ${etat.index + 1} sur ${items.length}`);

  scene.innerHTML = `
    <span class="axe-etiquette axe-${axe.cle}">${axe.libelle} · ${section.libelle}</span>
    <p class="enonce">${c.texte}</p>
    <div class="echelle">
      ${ECHELLE.map(e => `
        <button class="cran ${etat.reponses[c.cle]===e.note?"choisi":""}" data-note="${e.note}">
          <b>${e.note}</b><small>${e.ancre}</small>
        </button>`).join("")}
    </div>
    <div class="boutons" style="margin-top:18px">
      <button class="discret" id="retour">${etat.index === 0 ? "Modifier le profil" : "Énoncé précédent"}</button>
    </div>
  `;
  scene.querySelectorAll(".cran").forEach(el => {
    el.onclick = () => {
      etat.reponses[c.cle] = Number(el.dataset.note);
      if(etat.index < items.length - 1){ etat.index++; ecranEnonce(); }
      else { calculer(); finaliser(); }
    };
  });
  document.getElementById("retour").onclick = () => {
    if(etat.index === 0) ecranProfil();
    else { etat.index--; ecranEnonce(); }
  };
}

/* ==========================================================================
   6. CALCUL
   Sous-section = moyenne de ses énoncés. Axe = moyenne de ses sous-sections.
   Chaque niveau est converti en palier et en score sur 100. Pas de score global :
   la recommandation vise l'axe le plus faible, puis sa sous-section la plus faible.
   ========================================================================== */
function calculer(){
  const axes = axesEvalues().map(a => {
    const sections = a.sections.map(s => {
      const notes = enoncesDe(s).map((_, i) => etat.reponses[s.cle + "|" + i] || 0);
      const moyenne = notes.reduce((t, n) => t + n, 0) / notes.length;
      return { cle:s.cle, libelle:s.libelle, conseil:s.conseil, notes, moyenne,
               score:scoreSur100(moyenne), rang:rangDeMoyenne(moyenne) };
    });
    const moyenne = sections.reduce((t, s) => t + s.moyenne, 0) / sections.length;
    return { cle:a.cle, libelle:a.libelle, couleur:a.couleur, niveaux:a.niveaux, sections, moyenne,
             score:scoreSur100(moyenne), rang:rangDeMoyenne(moyenne) };
  });
  const axePrio = axes.slice().sort((x, y) => x.moyenne - y.moyenne)[0];
  const sectionPrio = axePrio.sections.slice().sort((x, y) => x.moyenne - y.moyenne)[0];
  etat.resultat = { axes, axePrio, sectionPrio, bim:bimEvalue() };
}

function detailReponses(){
  const cat = CATEGORIES.find(c => c.valeur === etat.categorie);
  const tai = TAILLES.find(t => t.valeur === etat.taille);
  const r = etat.resultat;
  const lignes = [
    `Diagnostic de maturité numérique · ${new Date().toISOString().split("T")[0]}`,
    `Activité : ${cat ? cat.libelle : etat.categorie} · Taille : ${tai ? tai.libelle : etat.taille}`,
    `Échelle : accord de 1 à 5. Score = (moyenne - 1) / 4 x 100.`,
    r.bim ? "" : "Volet BIM non évalué (activité sans BIM).",
    ""
  ];
  r.axes.forEach(a => {
    lignes.push(`${a.libelle} : ${a.score}/100 · ${NIVEAUX[a.rang].libelle}`);
    a.sections.forEach(s => {
      lignes.push(`   ${s.libelle} : ${s.score}/100 · ${NIVEAUX[s.rang].libelle}`);
      enoncesDe(AXES.find(x => x.cle === a.cle).sections.find(x => x.cle === s.cle)).forEach((texte, i) => {
        lignes.push(`      ${s.notes[i]}/5 : ${texte}`);
      });
    });
    lignes.push("");
  });
  lignes.push(`Priorité : ${r.axePrio.libelle} > ${r.sectionPrio.libelle}`);
  return lignes.filter(l => l !== null).join("\n");
}

/* ==========================================================================
   7. CONTACT ET ENVOI HUBSPOT
   L'utilisateur s'est identifié à la connexion au site : on envoie le résultat
   avec les informations du compte, sans bloquer l'affichage. Sans compte, un
   écran de coordonnées s'affiche avant les résultats.
   ========================================================================== */
function finaliser(){
  progression(100, "Terminé");
  let contact = { prenom:"", nom:"", entreprise:"", courriel:"" };
  try {
    const u = JSON.parse(localStorage.getItem("archiaid_user") || "null");
    if(u){
      const morceaux = (u.nom || "").trim().split(/\s+/).filter(Boolean);
      contact.prenom = morceaux.shift() || "";
      contact.nom = morceaux.join(" ") || contact.prenom;
      contact.courriel = (u.courriel || "").trim();
    }
  } catch(e){}
  if(!contact.courriel){ ecranGate(); return; }
  envoyerHubSpot(contact).catch(e => {
    etat.envoiEchoue = true;
    console.error("Envoi HubSpot échoué :", e);
  });
  ecranResultats();
}

function ecranGate(){
  progression(100, "Terminé");
  scene.innerHTML = `
    <h2>Votre lecture est prête</h2>
    <p>Indiquez où vous joindre et vous verrez vos scores sur chaque axe, avec la sous-section à prioriser.</p>
    <label class="champ" for="prenom">Prénom</label>
    <input type="text" id="prenom" autocomplete="given-name">
    <label class="champ" for="nom">Nom</label>
    <input type="text" id="nom" autocomplete="family-name">
    <label class="champ" for="entreprise">Entreprise</label>
    <input type="text" id="entreprise" autocomplete="organization">
    <label class="champ" for="courriel">Courriel professionnel</label>
    <input type="email" id="courriel" autocomplete="email">
    <div class="consentement">
      <input type="checkbox" id="consent">
      <label for="consent">J'accepte que Solutions Archi Aid inc. conserve ces renseignements pour me transmettre mon résultat et communiquer avec moi à ce sujet. Je peux retirer ce consentement en tout temps en écrivant à l'adresse indiquée dans les communications reçues.</label>
    </div>
    <div class="boutons"><button class="primaire" id="voir" disabled>Voir ma lecture complète</button></div>
  `;
  const champs = ["prenom","nom","entreprise","courriel"].map(id => document.getElementById(id));
  const consent = document.getElementById("consent");
  const voir = document.getElementById("voir");
  const valide = () => {
    const courriel = document.getElementById("courriel").value.trim();
    voir.disabled = !(champs.every(c => c.value.trim().length > 0)
                   && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(courriel)
                   && consent.checked);
  };
  champs.forEach(c => c.oninput = valide);
  consent.onchange = valide;
  voir.onclick = async () => {
    voir.disabled = true;
    voir.textContent = "Envoi en cours";
    try {
      await envoyerHubSpot({
        prenom:document.getElementById("prenom").value.trim(),
        nom:document.getElementById("nom").value.trim(),
        entreprise:document.getElementById("entreprise").value.trim(),
        courriel:document.getElementById("courriel").value.trim()
      });
    } catch(e){
      etat.envoiEchoue = true;
      console.error("Envoi HubSpot échoué :", e);
    }
    ecranResultats();
  };
}

/* Les champs envoyés au formulaire HubSpot : un par propriété de contact.
   Les scores BIM ne sont envoyés que si le volet a été évalué. */
function champsHubSpot(contact){
  const r = etat.resultat;
  const champs = [
    { name:"email",            value:contact.courriel },
    { name:"firstname",        value:contact.prenom },
    { name:"lastname",         value:contact.nom },
    { name:"company",          value:contact.entreprise },
    { name:"company_category", value:etat.categorie },
    { name:"company_size",     value:etat.taille }
  ];
  r.axes.forEach(a => {
    champs.push({ name:a.cle + "_score", value:String(a.score) });
    a.sections.forEach(s => champs.push({ name:s.cle + "_score", value:String(s.score) }));
  });
  return champs.filter(c => c.value !== "" && c.value != null);
}

async function envoyerHubSpot(contact){
  if(!CONFIG.PORTAL_ID || !CONFIG.FORM_GUID){
    console.info("HubSpot non configuré : résultat non envoyé.");
    return;
  }
  const tous = champsHubSpot(contact);
  async function soumettre(champs){
    const reponse = await fetch(
      `https://${CONFIG.HSFORMS_HOST}/submissions/v3/integration/submit/${CONFIG.PORTAL_ID}/${CONFIG.FORM_GUID}`,
      { method:"POST", headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          fields:champs,
          context:{ pageUri:window.location.href, pageName:document.title },
          legalConsentOptions:{ consent:{ consentToProcess:true,
            text:"J'accepte que Solutions Archi Aid inc. conserve ces renseignements pour me transmettre mon résultat et communiquer avec moi à ce sujet." } }
        })
      }
    );
    if(!reponse.ok) throw new Error("HTTP " + reponse.status + " " + await reponse.text());
  }
  try {
    await soumettre(tous);
  } catch(e){
    // HubSpot rejette toute la soumission si un champ manque au formulaire.
    // On réessaie avec le contact et le détail texte seulement, pour ne pas perdre le prospect.
    console.warn("Soumission complète refusée, nouvelle tentative avec les champs de base. Vérifiez que toutes les propriétés sont sur le formulaire.", e);
    const base = ["email","firstname","lastname","company"];
    await soumettre(tous.filter(c => base.includes(c.name)));
  }
}

/* ==========================================================================
   8. RÉSULTATS
   ========================================================================== */
function ecranResultats(){
  const r = etat.resultat;

  const cartes = r.axes.map(a => `
    <div class="score-carte ${a.cle === r.axePrio.cle ? "prio" : ""}">
      <div class="score-nom">${a.libelle}</div>
      <div class="score-chiffre" style="color:${a.couleur}">${a.score}<span class="score-sur"> / 100</span></div>
      <div class="score-niveau">${NIVEAUX[a.rang].libelle}</div>
      <div class="axe-jauge"><span style="width:${a.score}%;background:${a.couleur}"></span></div>
    </div>`).join("");

  const blocs = r.axes.map(a => `
    <div class="bloc-axe ${a.cle === r.axePrio.cle ? "bloc-prio" : ""}">
      <div class="bloc-entete">
        <h3>${a.libelle}</h3>
        <span class="bloc-niveau">${a.score} / 100 · ${NIVEAUX[a.rang].libelle}</span>
      </div>
      <p class="bloc-texte">${a.niveaux[a.rang]}</p>
      ${a.sections.map(s => {
        const prio = a.cle === r.axePrio.cle && s.cle === r.sectionPrio.cle;
        return `
        <div class="sous ${prio ? "prio" : ""}">
          <span class="sous-nom">${s.libelle}</span>
          <div class="axe-jauge"><span style="width:${s.score}%;background:${a.couleur}"></span></div>
          <span class="sous-val">${s.score} · ${NIVEAUX[s.rang].libelle}</span>
        </div>`;
      }).join("")}
    </div>`).join("");

  scene.innerHTML = `
    <h2>Vos scores de maturité</h2>
    <p>Chaque axe est calculé sur ses propres sous-sections. Il est normal qu'ils ne se situent pas au même niveau : c'est l'écart entre eux qui indique par où commencer.</p>
    <div class="scores ${r.axes.length === 2 ? "deux" : ""}">${cartes}</div>
    ${r.bim ? "" : `<div class="note-bim">Le volet Maturité BIM n'a pas été évalué : votre type d'activité n'implique pas la maquette numérique.</div>`}

    <h3>Le détail par sous-section</h3>
    <p>Chaque sous-section est notée sur 100. La ligne mise en évidence est celle où votre score est le plus faible dans l'axe à prioriser.</p>
    ${blocs}

    <div class="encadre">
      <h3>Par où commencer</h3>
      <p>Votre point d'appui le plus faible se situe sur l'axe <strong>${r.axePrio.libelle}</strong>, et plus précisément sur <strong>${r.sectionPrio.libelle.toLowerCase()}</strong>. ${r.sectionPrio.conseil}</p>
    </div>

    <div class="boutons" data-html2canvas-ignore>
      <button class="primaire" id="pdf">Télécharger en PDF</button>
      <button class="primaire" id="rdv">Réserver une rencontre</button>
      <button class="discret" id="refaire">Refaire le diagnostic</button>
    </div>
  `;

  document.getElementById("pdf").onclick = () =>
    telechargerPDF(".carte", "ArchiAid-Diagnostic-Maturite.pdf", document.getElementById("pdf"));
  document.getElementById("rdv").onclick = () => window.open(CONFIG.URL_RENDEZVOUS, "_blank");
  document.getElementById("refaire").onclick = () => {
    etat = { categorie:null, taille:null, reponses:{}, index:0, resultat:null, envoiEchoue:false };
    ecranAccueil();
  };
}

ecranAccueil();

/* ==========================================================================
   9. INTÉGRATION EN IFRAME
   Communique la hauteur réelle du contenu à une page qui l'héberge, pour que
   l'iframe s'ajuste au lieu d'afficher une barre de défilement interne.
   Sans effet si la page est ouverte directement.
   ========================================================================== */
(function(){
  if(window.parent === window) return;
  let derniere = 0;
  function annoncer(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
    if(Math.abs(h - derniere) < 2) return;
    derniere = h;
    window.parent.postMessage({ archiaidDiagnostic:true, hauteur:h }, "*");
  }
  window.addEventListener("load", annoncer);
  if(window.ResizeObserver) new ResizeObserver(annoncer).observe(document.body);
  setInterval(annoncer, 500);
  annoncer();
})();
</script>

<!-- ==========================================================================
     10. TÉLÉCHARGEMENT PDF
     Convertit la carte de résultats en PDF téléchargeable (html2pdf).
     En cas d'échec (hors ligne, blocage du CDN), on retombe sur l'impression
     du navigateur, qui permet aussi d'enregistrer en PDF.
     ========================================================================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
function telechargerPDF(selecteur, nomFichier, bouton){
  const cible = document.querySelector(selecteur);
  if(!cible) return;
  const texteInitial = bouton ? bouton.textContent : "";
  const retablir = () => { if(bouton){ bouton.disabled = false; bouton.textContent = texteInitial; } };
  if(bouton){ bouton.disabled = true; bouton.textContent = "Génération du PDF…"; }
  if(typeof html2pdf === "undefined"){ retablir(); window.print(); return; }
  html2pdf().set({
    margin:[10, 8, 12, 8],
    filename:nomFichier,
    image:{ type:"jpeg", quality:0.95 },
    html2canvas:{ scale:2, useCORS:true, backgroundColor:"#ffffff" },
    jsPDF:{ unit:"mm", format:"a4", orientation:"portrait" },
    pagebreak:{ mode:["avoid-all", "css", "legacy"] }
  }).from(cible).save()
    .then(retablir)
    .catch(function(e){ console.error("PDF échoué :", e); retablir(); window.print(); });
}
</script>
